<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VelocityAI — SOP Compliance Checker</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3250;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  header span { color: var(--muted); font-size: 13px; margin-left: auto; }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 420px 1fr;
    grid-template-rows: 1fr;
    height: calc(100vh - 73px);
  }

  /* ── Left Panel ── */
  .left-panel {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .form-area {
    padding: 20px 24px;
    flex: 1;
    overflow-y: auto;
  }

  .form-row { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  input, textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 10px 13px;
    outline: none;
    resize: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 160px; line-height: 1.5; }

  /* ── Drop zone ── */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 18px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 10px;
    position: relative;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(108,99,255,0.06);
  }
  .drop-zone input[type=file] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer; width: 100%; height: 100%;
    padding: 0; border: none; background: none;
  }
  .drop-zone .dz-icon { font-size: 22px; margin-bottom: 4px; }
  .drop-zone .dz-text { font-size: 12px; color: var(--muted); }
  .drop-zone .dz-text b { color: var(--accent2); }
  .drop-zone .dz-filename {
    margin-top: 6px; font-size: 12px;
    color: var(--green); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .or-divider {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--muted);
    margin-bottom: 8px;
  }
  .or-divider::before, .or-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn-submit {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    margin-top: 4px;
  }
  .btn-submit:hover { background: #5a52e0; }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Recent Jobs ── */
  .jobs-section {
    border-top: 1px solid var(--border);
  }
  .jobs-list {
    overflow-y: auto;
    max-height: 220px;
  }
  .job-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
    font-size: 13px;
  }
  .job-item:hover { background: var(--surface2); }
  .job-item.active { background: rgba(108,99,255,0.12); }
  .job-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-pending  { background: var(--yellow); }
  .dot-processing { background: var(--accent); animation: pulse 1.2s infinite; }
  .dot-completed { background: var(--green); }
  .dot-failed   { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .job-id    { font-family: monospace; color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .job-agent { color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job-time  { color: var(--muted); font-size: 11px; flex-shrink: 0; }

  /* ── Right Panel ── */
  .right-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .result-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px 36px;
  }

  /* ── Empty state ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; opacity: 0.3; }
  .empty-state p { font-size: 14px; }

  /* ── Spinner ── */
  .spinner-wrap {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; gap: 16px; color: var(--muted);
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner-label { font-size: 14px; }

  /* ── Report ── */
  .report-header {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .score-ring {
    position: relative;
    width: 90px; height: 90px;
    flex-shrink: 0;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .score-label {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    line-height: 1;
  }
  .score-ring .score-sub {
    font-size: 10px; color: var(--muted); margin-top: 2px;
  }

  .report-meta { flex: 1; min-width: 200px; }
  .report-meta h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .report-meta .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .badge-ok   { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge-fail { background: rgba(239,68,68,0.15);  color: var(--red); }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin-top: 8px;
  }
  .meta-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .meta-item .key { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .meta-item .val { font-size: 13px; font-weight: 600; margin-top: 2px; }

  /* ── Section card ── */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .section-title {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .section-body { padding: 16px; }

  .summary-text { font-size: 14px; line-height: 1.6; color: var(--text); }

  /* ── Violations ── */
  .violation-card {
    background: rgba(239,68,68,0.07);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .violation-card:last-child { margin-bottom: 0; }
  .v-rule {
    font-size: 13px; font-weight: 600;
    color: #fca5a5;
    margin-bottom: 6px;
  }
  .v-desc { font-size: 13px; color: var(--text); margin-bottom: 8px; line-height: 1.5; }
  .v-evidence {
    background: rgba(0,0,0,0.3);
    border-left: 3px solid var(--red);
    padding: 8px 12px;
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    font-style: italic;
    color: var(--muted);
    line-height: 1.5;
  }

  .no-violations {
    display: flex; align-items: center; gap: 10px;
    color: var(--green);
    font-size: 14px; font-weight: 500;
    padding: 4px 0;
  }

  /* ── Recommendation ── */
  .rec-text {
    font-size: 14px; line-height: 1.6;
    padding-left: 12px;
    border-left: 3px solid var(--accent);
    color: var(--text);
  }

  /* ── Job ID strip ── */
  .job-id-strip {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--muted);
    margin-bottom: 20px;
  }
  .job-id-strip code {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: monospace;
    font-size: 11px;
    color: var(--text);
  }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    max-width: 320px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">⚡</div>
  <h1>VelocityAI</h1>
  <span>IndiaMart SOP Compliance Checker</span>
</header>

<div class="layout">

  <!-- ── LEFT: Form + Jobs ── -->
  <div class="left-panel">
    <div class="panel-header">Submit Transcription</div>

    <div class="form-area">
      <form id="submitForm">
        <div class="form-row">
          <label>Call Transcription *</label>

          <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" accept=".txt,.text,.log,.csv" />
            <div class="dz-icon">📂</div>
            <div class="dz-text"><b>Click to browse</b> or drag &amp; drop a file</div>
            <div class="dz-text">.txt · .log · .csv</div>
            <div class="dz-filename" id="dzFilename" style="display:none"></div>
          </div>

          <div class="or-divider">or paste manually</div>

          <textarea id="transcription" placeholder="Paste the full call transcript here…" required></textarea>
        </div>
        <div class="row2">
          <div class="form-row">
            <label>Agent Name</label>
            <input id="agentName" type="text" placeholder="e.g. Rahul Sharma" />
          </div>
          <div class="form-row">
            <label>Caller ID</label>
            <input id="callerId" type="text" placeholder="e.g. +91 98765 43210" />
          </div>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
          ▶ Run Compliance Check
        </button>
      </form>
    </div>

    <div class="jobs-section">
      <div class="panel-header" style="display:flex;align-items:center;justify-content:space-between;">
        <span>Recent Jobs</span>
        <span id="jobCount" style="color:var(--text);font-size:12px;text-transform:none;letter-spacing:0;"></span>
      </div>
      <div class="jobs-list" id="jobsList">
        <!-- populated by JS -->
      </div>
    </div>
  </div>

  <!-- ── RIGHT: Results ── -->
  <div class="right-panel">
    <div class="panel-header">Compliance Report</div>
    <div class="result-area" id="resultArea">
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>Submit a transcription to see the compliance report</p>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
const API = '';  // same origin
let pollTimer = null;
let activeJobId = null;
const pendingJobs = new Map(); // jobs submitted this session, not yet in Qdrant

// Normalize flat Qdrant report payload → job-shaped object for renderReport()
function qdrantToJob(r) {
  return {
    job_id: r.job_id,
    status: 'completed',
    category: r.category,
    violations_found: r.violations_found,
    agent_name: r.agent_name,
    created_at: r.created_at,
    report: [{
      job_id: r.job_id,
      category: r.category,
      violations_found: r.violations_found,
      violations: r.violations || [],
      compliance_score: r.compliance_score,
      compliance_summary: r.compliance_summary,
      recommendation: r.recommendation,
    }],
  };
}

// ── Form submit ──────────────────────────────────────────────────────────────
document.getElementById('submitForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = document.getElementById('transcription').value.trim();
  if (!text) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Submitting…';

  try {
    const res = await fetch(`${API}/api/transcription`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        transcription: text,
        agent_name: document.getElementById('agentName').value.trim() || null,
        caller_id:   document.getElementById('callerId').value.trim() || null,
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    const job = await res.json();
    showToast(`Job submitted — ID: ${job.job_id.slice(0,8)}…`);
    pendingJobs.set(job.job_id, {
      job_id: job.job_id,
      status: 'pending',
      agent_name: document.getElementById('agentName').value.trim() || null,
      created_at: new Date().toISOString().replace('Z', ''),
    });
    watchJob(job.job_id);
    loadJobs();
  } catch (err) {
    showToast(`Error: ${err.message}`, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Run Compliance Check';
  }
});

// ── Poll a job ───────────────────────────────────────────────────────────────
function watchJob(jobId) {
  clearInterval(pollTimer);
  activeJobId = jobId;
  showSpinner(jobId);
  pollTimer = setInterval(async () => {
    const job = await fetchJob(jobId);
    if (!job) return;
    renderReport(job);
    loadJobs();
    if (job.status === 'completed' || job.status === 'failed') {
      clearInterval(pollTimer);
      pendingJobs.delete(jobId);
    }
  }, 2000);
}

async function fetchJob(id) {
  try {
    const r = await fetch(`${API}/api/jobs/${id}`);
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

// ── Load recent jobs list (from shared Qdrant, merged with local pending) ────
async function loadJobs() {
  try {
    const r = await fetch(`${API}/api/reports?limit=30`);
    if (!r.ok) return;
    const data = await r.json();
    // deduplicate: one sidebar row per job_id (latest analysis wins)
    const byJobId = new Map();
    for (const r of data.reports || []) {
      if (!byJobId.has(r.job_id) ||
          new Date(r.created_at) > new Date(byJobId.get(r.job_id).created_at)) {
        byJobId.set(r.job_id, r);
      }
    }
    const qdrantJobs = Array.from(byJobId.values()).map(qdrantToJob);

    // drop from pendingJobs anything that has landed in Qdrant
    const qdrantIds = new Set(qdrantJobs.map(j => j.job_id));
    for (const id of pendingJobs.keys()) {
      if (qdrantIds.has(id)) pendingJobs.delete(id);
    }

    // merge local pending + Qdrant completed, newest first
    const allJobs = [...Array.from(pendingJobs.values()), ...qdrantJobs]
      .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))
      .slice(0, 30);

    renderJobsList(allJobs);
  } catch {}
}

function renderJobsList(jobs) {
  const el = document.getElementById('jobsList');
  document.getElementById('jobCount').textContent = `${jobs.length} job${jobs.length !== 1 ? 's' : ''}`;
  if (!jobs.length) {
    el.innerHTML = '<div style="padding:16px 24px;color:var(--muted);font-size:13px;">No jobs yet</div>';
    return;
  }
  el.innerHTML = jobs.map(j => `
    <div class="job-item ${j.job_id === activeJobId ? 'active' : ''}"
         onclick="loadJobById('${j.job_id}')">
      <div class="job-dot dot-${j.status}"></div>
      <div class="job-agent">${j.agent_name || 'Unknown agent'}</div>
      <div class="job-id">${j.job_id.slice(0,8)}</div>
      <div class="job-time">${timeAgo(j.created_at)}</div>
    </div>
  `).join('');
}

async function fetchReport(id) {
  try {
    const r = await fetch(`${API}/api/reports/${id}`);
    if (!r.ok) return null;
    const data = await r.json();
    const analyses = data.analyses || [];
    if (!analyses.length) return null;
    const latest = analyses[analyses.length - 1];
    return {
      job_id: latest.job_id,
      status: 'completed',
      agent_name: latest.agent_name,
      created_at: analyses[0].created_at,  // job's first analysis date
      violations_found: latest.violations_found,
      category: latest.category,
      report: analyses.map(a => ({
        job_id: a.job_id,
        category: a.category,
        violations_found: a.violations_found,
        violations: a.violations || [],
        compliance_score: a.compliance_score,
        compliance_summary: a.compliance_summary,
        recommendation: a.recommendation,
        created_at: a.created_at,
      })),
    };
  } catch { return null; }
}

async function loadJobById(id) {
  activeJobId = id;
  // try Qdrant first (completed, shared across machines)
  const report = await fetchReport(id);
  if (report) {
    renderReport(report);
    loadJobs();
    return;
  }
  // fall back to local SQLite (pending / processing jobs on this machine)
  const job = await fetchJob(id);
  if (!job) return;
  if (job.status === 'pending' || job.status === 'processing') {
    watchJob(id);
  } else {
    renderReport(job);
  }
  loadJobs();
}

// ── Render ───────────────────────────────────────────────────────────────────
function showSpinner(jobId) {
  document.getElementById('resultArea').innerHTML = `
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="spinner-label">Analysing transcription…</div>
      <div style="font-size:11px;color:var(--muted);font-family:monospace">${jobId}</div>
    </div>`;
}

function renderReport(job) {
  const area = document.getElementById('resultArea');

  if (job.status === 'pending' || job.status === 'processing') {
    showSpinner(job.job_id);
    return;
  }

  if (job.status === 'failed') {
    area.innerHTML = `
      <div class="job-id-strip">Job <code>${job.job_id}</code></div>
      <div class="section">
        <div class="section-title" style="color:var(--red)">Processing Failed</div>
        <div class="section-body">
          <p style="color:var(--muted);font-size:13px;">${job.error || 'Unknown error'}</p>
        </div>
      </div>`;
    return;
  }

  // report is a list of analyses; show latest, older ones in history
  const allReports = Array.isArray(job.report) ? job.report : (job.report ? [job.report] : []);
  const r = allReports.length ? allReports[allReports.length - 1] : {};
  const score = r.compliance_score ?? 0;
  const hasViolations = r.violations_found;
  const violations = r.violations || [];
  const color = score >= 80 ? '#22c55e' : score >= 50 ? '#f59e0b' : '#ef4444';
  const circumference = 2 * Math.PI * 38;
  const dash = (score / 100) * circumference;

  area.innerHTML = `
    <div class="job-id-strip">
      Job <code>${job.job_id}</code>
      <span style="color:var(--green);font-size:11px;">✓ Completed</span>
    </div>

    <div class="report-header">
      <div class="score-ring">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="38" fill="none" stroke="var(--border)" stroke-width="7"/>
          <circle cx="45" cy="45" r="38" fill="none"
            stroke="${color}" stroke-width="7"
            stroke-dasharray="${dash} ${circumference}"
            stroke-linecap="round"/>
        </svg>
        <div class="score-label">
          <span style="color:${color}">${score}</span>
          <span class="score-sub">/ 100</span>
        </div>
      </div>

      <div class="report-meta">
        <h2>Compliance Report</h2>
        <span class="badge ${hasViolations ? 'badge-fail' : 'badge-ok'}">
          ${hasViolations ? `⚠ ${violations.length} Violation${violations.length !== 1 ? 's' : ''} Found` : '✓ Fully Compliant'}
        </span>
        <div class="meta-grid">
          <div class="meta-item">
            <div class="key">Category</div>
            <div class="val">${formatCategory(r.category)}</div>
          </div>
          <div class="meta-item">
            <div class="key">Score</div>
            <div class="val" style="color:${color}">${score}/100</div>
          </div>
          ${job.agent_name ? `<div class="meta-item"><div class="key">Agent</div><div class="val">${job.agent_name}</div></div>` : ''}
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Summary</div>
      <div class="section-body">
        <p class="summary-text">${r.compliance_summary || '—'}</p>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Violations ${violations.length ? `(${violations.length})` : ''}
      </div>
      <div class="section-body">
        ${violations.length === 0
          ? `<div class="no-violations">✓ No violations detected — this call meets all SOP requirements.</div>`
          : violations.map((v, i) => `
            <div class="violation-card">
              <div class="v-rule">Rule ${i+1}: ${v.rule}</div>
              <div class="v-desc">${v.description}</div>
              ${v.evidence ? `<div class="v-evidence">"${v.evidence}"</div>` : ''}
            </div>`).join('')
        }
      </div>
    </div>

    <div class="section">
      <div class="section-title">Recommendation</div>
      <div class="section-body">
        <p class="rec-text">${r.recommendation || '—'}</p>
      </div>
    </div>

    ${allReports.length > 1 ? `
    <div class="section">
      <div class="section-title">Previous Analyses (${allReports.length - 1})</div>
      <div class="section-body">
        ${[...allReports].reverse().slice(1).map((pr, i) => {
          const ps = pr.compliance_score ?? 0;
          const pc = ps >= 80 ? '#22c55e' : ps >= 50 ? '#f59e0b' : '#ef4444';
          return `<div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <span style="font-size:12px;color:var(--muted);">Analysis #${allReports.length - 1 - i} &nbsp;·&nbsp; ${pr.created_at ? timeAgo(pr.created_at) : ''}</span>
              <span style="font-size:13px;font-weight:700;color:${pc}">${ps}/100</span>
            </div>
            <p style="font-size:13px;color:var(--text);line-height:1.5;">${pr.compliance_summary || '—'}</p>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}
  `;
}

// ── Utilities ────────────────────────────────────────────────────────────────
function formatCategory(cat) {
  if (!cat) return '—';
  return cat.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function timeAgo(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso + 'Z').getTime()) / 1000;
  if (diff < 60)  return `${Math.floor(diff)}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  return `${Math.floor(diff/3600)}h ago`;
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isError ? 'var(--red)' : 'var(--accent)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ── File upload / drag-and-drop ──────────────────────────────────────────────
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const dzFilename = document.getElementById('dzFilename');

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('transcription').value = e.target.result;
    dzFilename.textContent = '✓ ' + file.name;
    dzFilename.style.display = 'block';
    showToast(`Loaded: ${file.name}`);
  };
  reader.readAsText(file);
}

fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  loadFile(e.dataTransfer.files[0]);
});

// ── Boot ─────────────────────────────────────────────────────────────────────
loadJobs();
setInterval(loadJobs, 10000);
</script>
</body>
</html>
